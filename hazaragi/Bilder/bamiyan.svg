<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <title>دره بامیان با جای خالی بت بزرگ</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2f5c"/>
      <stop offset=".45" stop-color="#6b4a6e"/>
      <stop offset=".75" stop-color="#d98b4a"/>
      <stop offset="1" stop-color="#f3c77a"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86c"/>
      <stop offset="1" stop-color="#9c6a3c"/>
    </linearGradient>
    <linearGradient id="niche" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3620"/>
      <stop offset="1" stop-color="#7d4f2e"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f8f3c"/>
      <stop offset="1" stop-color="#4b5a24"/>
    </linearGradient>
    <pattern id="strata" width="60" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 9 Q15 5 30 9 T60 9" fill="none" stroke="#b07e4a" stroke-width="2" opacity=".5"/>
    </pattern>
    <g id="pop"><ellipse cx="0" cy="0" rx="9" ry="42" fill="#2f3d14"/><rect x="-1.5" y="38" width="3" height="14" fill="#4a2f1a"/></g>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1240" cy="190" r="70" fill="#f8dd9a" opacity=".9"/>
  <circle cx="1240" cy="190" r="110" fill="#f8dd9a" opacity=".15"/>
  <g fill="#fff" opacity=".8">
    <circle cx="200" cy="70" r="1.6"/><circle cx="340" cy="120" r="1.2"/><circle cx="520" cy="50" r="1.8"/>
    <circle cx="760" cy="95" r="1.2"/><circle cx="930" cy="40" r="1.5"/><circle cx="1450" cy="80" r="1.3"/>
  </g>
  <!-- distant snowy Koh-e Baba -->
  <path d="M0 330 L120 250 L210 300 L330 200 L450 290 L560 230 L700 310 L820 240 L960 300 L1090 220 L1210 290 L1350 230 L1480 280 L1600 240 L1600 420 L0 420Z" fill="#54608a" opacity=".85"/>
  <path d="M330 200 L300 222 L318 225 L335 214 L352 230 L372 226Z M1090 220 L1060 245 L1080 246 L1095 236 L1110 250 L1125 245Z M820 240 L798 258 L815 260 L826 252 L840 262Z" fill="#e9eef7"/>
  <!-- cliff -->
  <path d="M0 360 Q200 330 400 345 Q700 320 1000 340 Q1300 325 1600 350 L1600 560 L0 560Z" fill="url(#cliff)"/>
  <path d="M0 360 Q200 330 400 345 Q700 320 1000 340 Q1300 325 1600 350 L1600 560 L0 560Z" fill="url(#strata)"/>
  <!-- great niche -->
  <path d="M640 545 L640 410 Q640 352 700 350 Q760 352 760 410 L760 545Z" fill="url(#niche)"/>
  <path d="M655 545 L655 415 Q655 368 700 366 Q745 368 745 415 L745 545Z" fill="#3d2414" opacity=".55"/>
  <!-- small niche -->
  <path d="M1110 545 L1110 455 Q1110 420 1140 418 Q1170 420 1170 455 L1170 545Z" fill="url(#niche)"/>
  <!-- caves -->
  <g fill="#5a3620">
    <rect x="300" y="430" width="16" height="22" rx="8"/><rect x="340" y="470" width="14" height="20" rx="7"/>
    <rect x="420" y="415" width="18" height="24" rx="9"/><rect x="480" y="460" width="14" height="20" rx="7"/>
    <rect x="560" y="440" width="16" height="22" rx="8"/><rect x="830" y="430" width="16" height="22" rx="8"/>
    <rect x="880" y="470" width="14" height="20" rx="7"/><rect x="960" y="420" width="18" height="24" rx="9"/>
    <rect x="1010" y="480" width="14" height="20" rx="7"/><rect x="1240" y="440" width="16" height="22" rx="8"/>
    <rect x="1320" y="470" width="14" height="20" rx="7"/><rect x="1400" y="430" width="18" height="24" rx="9"/>
  </g>
  <!-- fields -->
  <path d="M0 540 Q400 520 800 540 Q1200 560 1600 535 L1600 700 L0 700Z" fill="url(#field)"/>
  <path d="M0 600 Q300 585 600 605 Q900 625 1200 600 Q1400 585 1600 600 L1600 700 L0 700Z" fill="#3f4c1c"/>
  <path d="M0 640 Q400 620 820 650 Q1200 676 1600 640" fill="none" stroke="#7fb6c9" stroke-width="10" opacity=".8"/>
  <!-- poplars -->
  <g fill="#2f3d14">
    <use href="#pop" x="80" y="545"/><use href="#pop" x="110" y="540"/><use href="#pop" x="140" y="548"/>
    <use href="#pop" x="380" y="535"/><use href="#pop" x="405" y="540"/><use href="#pop" x="900" y="545"/>
    <use href="#pop" x="930" y="540"/><use href="#pop" x="960" y="548"/><use href="#pop" x="1380" y="540"/>
    <use href="#pop" x="1410" y="535"/><use href="#pop" x="1440" y="545"/><use href="#pop" x="1470" y="540"/>
  </g>
  <!-- houses -->
  <g fill="#c99a62" stroke="#7a5230" stroke-width="2">
    <rect x="200" y="560" width="70" height="38"/><rect x="275" y="570" width="50" height="28"/>
    <rect x="1200" y="565" width="80" height="36"/><rect x="1285" y="575" width="45" height="26"/>
  </g>
  <g fill="#5a3620"><rect x="225" y="575" width="12" height="14"/><rect x="1230" y="578" width="12" height="14"/></g>
</svg>
