<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760">
  <title>دمبوره‌نواز هزاره – به سبک نگارگری</title>
  <defs>
    <pattern id="stars" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#1f3a6b"/>
      <path d="M30 18 L33 27 L42 30 L33 33 L30 42 L27 33 L18 30 L27 27Z" fill="#d4a63a" opacity=".55"/>
      <circle cx="0" cy="0" r="2" fill="#d4a63a" opacity=".5"/><circle cx="60" cy="60" r="2" fill="#d4a63a" opacity=".5"/>
    </pattern>
    <pattern id="chapan" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#5b2a4e"/>
      <rect width="5" height="22" fill="#2e6b5a"/><rect x="5" width="2" height="22" fill="#d4a63a"/>
      <rect x="13" width="3" height="22" fill="#8e2b20"/>
    </pattern>
    <pattern id="carpet" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#8e2b20"/>
      <path d="M20 4 L36 20 L20 36 L4 20Z" fill="#5c1a12"/>
      <path d="M20 12 L28 20 L20 28 L12 20Z" fill="#d4a63a"/>
    </pattern>
    <pattern id="cap" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#1d4f45"/>
      <circle cx="8" cy="8" r="3.2" fill="#e8c35a"/><circle cx="8" cy="8" r="1.3" fill="#8e2b20"/>
      <circle cx="0" cy="0" r="1.6" fill="#f2e6c8"/><circle cx="16" cy="16" r="1.6" fill="#f2e6c8"/>
    </pattern>
  </defs>
  <rect width="600" height="760" fill="#efe0bd"/>
  <rect x="20" y="20" width="560" height="720" fill="none" stroke="#8e2b20" stroke-width="6"/>
  <rect x="32" y="32" width="536" height="696" fill="none" stroke="#c99a2e" stroke-width="2"/>
  <path d="M90 700 L90 270 Q90 130 300 80 Q510 130 510 270 L510 700Z" fill="url(#stars)" stroke="#c99a2e" stroke-width="5"/>
  <circle cx="300" cy="170" r="34" fill="#f3d27a" opacity=".85"/>
  <!-- carpet -->
  <rect x="60" y="590" width="480" height="125" fill="url(#carpet)" stroke="#d4a63a" stroke-width="5"/>
  <!-- body / chapan -->
  <path d="M240 335 Q300 318 360 335 L405 420 Q432 520 470 610 Q300 655 130 610 Q168 520 195 420Z" fill="url(#chapan)" stroke="#2a1608" stroke-width="2"/>
  <path d="M282 335 L300 400 L318 335Z" fill="#f2e6c8"/>
  <rect x="284" y="300" width="32" height="40" fill="#d9a77a"/>
  <!-- dambura -->
  <g transform="translate(232 500) rotate(-35)">
    <rect x="34" y="-7" width="250" height="14" rx="3" fill="#7a4a22" stroke="#3a2210" stroke-width="2"/>
    <rect x="276" y="-11" width="26" height="22" rx="4" fill="#5e3818"/>
    <circle cx="286" cy="-15" r="4" fill="#3a2210"/><circle cx="294" cy="15" r="4" fill="#3a2210"/>
    <path d="M10 -48 Q-78 -46 -86 0 Q-78 46 10 48 Q42 32 48 0 Q42 -32 10 -48Z" fill="#a8672c" stroke="#3a2210" stroke-width="3"/>
    <path d="M0 -36 Q-62 -34 -68 0 Q-62 34 0 36" fill="none" stroke="#d4a63a" stroke-width="2"/>
    <circle cx="-20" cy="0" r="6" fill="#3a2210"/>
    <line x1="-62" y1="-3" x2="280" y2="-3" stroke="#f2e6c8" stroke-width="1.3"/>
    <line x1="-62" y1="3" x2="280" y2="3" stroke="#f2e6c8" stroke-width="1.3"/>
  </g>
  <!-- sleeves -->
  <path d="M246 340 Q205 380 210 450 Q222 478 262 470 Q252 430 268 380Z" fill="url(#chapan)" stroke="#2a1608" stroke-width="2"/>
  <path d="M354 340 Q398 352 425 372 L412 392 Q380 380 346 372Z" fill="url(#chapan)" stroke="#2a1608" stroke-width="2"/>
  <ellipse cx="266" cy="470" rx="15" ry="12" fill="#d9a77a" stroke="#8a5a36"/>
  <ellipse cx="424" cy="370" rx="13" ry="15" fill="#d9a77a" stroke="#8a5a36"/>
  <!-- head -->
  <ellipse cx="300" cy="262" rx="46" ry="55" fill="#e0b088" stroke="#8a5a36" stroke-width="2"/>
  <path d="M254 248 Q250 270 258 286 L262 250Z M346 248 Q350 270 342 286 L338 250Z" fill="#1c120a"/>
  <path d="M250 244 Q252 186 300 182 Q348 186 350 244 Q300 232 250 244Z" fill="url(#cap)" stroke="#d4a63a" stroke-width="3"/>
  <path d="M250 244 Q300 232 350 244" fill="none" stroke="#8e2b20" stroke-width="5"/>
  <path d="M272 256 Q282 250 292 256" fill="none" stroke="#1c120a" stroke-width="3"/>
  <path d="M308 256 Q318 250 328 256" fill="none" stroke="#1c120a" stroke-width="3"/>
  <path d="M274 266 Q282 261 290 266 Q282 269 274 266Z M310 266 Q318 261 326 266 Q318 269 310 266Z" fill="#1c120a"/>
  <path d="M300 268 L296 288 L304 289" fill="none" stroke="#8a5a36" stroke-width="2"/>
  <path d="M280 298 Q300 290 320 298 Q300 304 280 298Z" fill="#1c120a"/>
  <path d="M290 306 Q300 310 310 306" fill="none" stroke="#8e2b20" stroke-width="2"/>
  <!-- music notes -->
  <g fill="#d4a63a" opacity=".85">
    <path d="M450 230 l0 -40 l18 -6 l0 40" stroke="#d4a63a" stroke-width="3" fill="none"/><circle cx="445" cy="232" r="7"/><circle cx="463" cy="226" r="7"/>
    <path d="M150 300 l0 -34" stroke="#d4a63a" stroke-width="3"/><circle cx="145" cy="302" r="7"/>
  </g>
</svg>
